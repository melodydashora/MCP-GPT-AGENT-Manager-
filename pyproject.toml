[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gpt-agent-manager"
version = "0.1.0"
description = "MCP server with Eidolon secure agent, proxied through Vecto for repo management"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "gitpython>=3.1.40",
    "cryptography>=41.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
mcp-agent-manager = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
